name: hello_world
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build step
        run: echo "a demo build"
  test: 
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: test step
        run: echo "a demo test"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: deploy step
        run: echo "a demp deploy"
  
