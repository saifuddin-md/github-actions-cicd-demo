name: Kubernetes CI
on:
  push:
    branches:
      - dev                          
      - 'feature/**'                 #push feature/kubernetes-ci - CI runs - PR - dev - CI runs again
jobs:
  rr-app-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: check latest
        run: ls -la

      - name: Build Docker Image
        run: "docker build -t xrootms/app-frontend:${GITHUB_SHA::7} --build-arg REACT_APP_API_URL=/api/v1 ./app/frontend"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASS }}"

      - name: Push Docker Image to Docker Hub
        run: "docker push xrootms/app-frontend:${GITHUB_SHA::7}"

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update deployment.yml with latest docker tag
        run: |
          # Short commit hash
          SHORT_SHA=${GITHUB_SHA::7}

          # Update image tag in deployment.yaml
          yq -i '.spec.template.spec.containers[0].image = "xrootms/app-frontend:'"$SHORT_SHA"'"' ./k8s/app/frontend/frontend-deployment.yaml

      - name: Commit deployment file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@noreply"
          git switch feature/kubernetes-ci
          git add k8s/app/frontend/frontend-deployment.yaml
          git commit -m 'docker tag updated by GHA'
          git push 